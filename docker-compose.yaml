services:

  postgres-174:
    image: postgres:17.4
    restart: unless-stopped
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: datagokr # datagokr 메타데이터로 테스트 진행
      TZ: Asia/Seoul
      LANG: ko_KR.UTF-8
    ports:
      - "5432:5432"
    volumes:
      - pgdata-postgres17:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d # todo create table 필요할 경우

  # DB client tool 이 없을 경우, 웹에서 간편하게 사용
  adminer:
    image: adminer
    environment:
      TZ: Asia/Seoul
      LANG: ko_KR.UTF-8
    restart: always
    ports:
      - 8888:8080

volumes:
  pgdata-postgres17: