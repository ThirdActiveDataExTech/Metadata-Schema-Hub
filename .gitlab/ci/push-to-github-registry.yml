.push-to-github-registry:
  stage: push-to-github
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    # Use TLS https://docs.gitlab.com/ee/ci/docker/using_docker_build.html#tls-enabled
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - cd $APP_DIR
  script:
    # GitLab Registry에서 latest 이미지 pull
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker pull "$CI_REGISTRY_IMAGE/$APP_NAME:latest"

    # 이미지에서 VERSION 추출
    - |
      VERSION=$(docker run --rm "$CI_REGISTRY_IMAGE/$APP_NAME:latest" \
        sh -c "cat version_info.py | grep '^version:' | cut -d \"'\" -f2" || echo "")
      if [ -z "$VERSION" ]; then
        echo "Error: Failed to extract version from container"
        exit 1
      fi
      echo "Extracted version: $VERSION"

    # GitHub Registry에 push (소문자 변환)
    - GITHUB_OWNER_LOWER=$(echo "$GITHUB_OWNER" | tr '[:upper:]' '[:lower:]')
    - echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_USERNAME" --password-stdin || { echo "GitHub login failed"; exit 1; }
    - docker tag "$CI_REGISTRY_IMAGE/$APP_NAME:latest" "ghcr.io/$GITHUB_OWNER_LOWER/$APP_NAME:latest"
    - docker tag "$CI_REGISTRY_IMAGE/$APP_NAME:latest" "ghcr.io/$GITHUB_OWNER_LOWER/$APP_NAME:$VERSION"
    - docker push "ghcr.io/$GITHUB_OWNER_LOWER/$APP_NAME:$VERSION"
    - docker push "ghcr.io/$GITHUB_OWNER_LOWER/$APP_NAME:latest"
  dependencies: []
