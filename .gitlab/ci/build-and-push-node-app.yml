.build-and-push-node-app-monorepo:
  stage: build-and-push-app
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    PIPELINE_SEQUENCE: $CI_PIPELINE_IID
    TZ: "Asia/Seoul"
    FF_TIMESTAMPS: true
    IMAGE_TAG_LATEST: "$CI_REGISTRY_IMAGE/$APP_NAME:latest"
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - cd $APP_DIR
    - apk add --no-cache tzdata jq
    - |
      MAJOR_VERSION=$(jq -r '.version' package.json)
      STATUS=${STATUS:-dev}

      VERSION=${MAJOR_VERSION}.$(date +'%y%m.%d')-${STATUS}-$CI_COMMIT_SHORT_SHA
    - IMAGE_TAG=$CI_REGISTRY_IMAGE/$APP_NAME:$VERSION
    - BUILD_DATE=$(date +'%Y-%m-%d %H:%M:%S')
    - |
      echo "VITE_VERSION=$VERSION" > .env
      echo "VITE_BUILD_DATE=$BUILD_DATE" >> .env
    - cd $CI_PROJECT_DIR
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY || exit 1
    - docker pull $IMAGE_TAG_LATEST || true
    - >-
      docker build
      --build-arg BUILDKIT_INLINE_CACHE=1
      --build-arg APP_VERSION=$VERSION
      --cache-from $IMAGE_TAG_LATEST
      -f $APP_DIR/Dockerfile
      -t $IMAGE_TAG -t $IMAGE_TAG_LATEST .
    - docker push $IMAGE_TAG
    - docker push $IMAGE_TAG_LATEST
